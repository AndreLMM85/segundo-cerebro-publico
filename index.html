<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Segundo Cérebro</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#e7eef9}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1150px;margin:auto;padding:20px}h1{font-size:32px}h2{margin-top:30px}p,small{color:#aebed5;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#152238;border:1px solid #253953;border-radius:16px;padding:18px;min-width:0}.tag{display:inline-block;border-radius:16px;padding:5px 10px;font-size:13px;margin:3px;background:#253d56}.urgente{background:#69272d;color:#ffe3e5}.alta{background:#653b17;color:#ffe4c5}.media{background:#554c15;color:#fff4b8}.baixa{background:#193d68;color:#d9eaff}.row{padding:12px 0;border-bottom:1px solid #253953}.notice{border-left:3px solid #70d6ef;padding-left:12px}select{padding:10px;border-radius:8px;margin-bottom:15px}.gamification{background:linear-gradient(135deg,#152238,#1b2f4d);border:1px solid #2f4d74;border-radius:16px;padding:18px;margin-bottom:18px}.xpbar{height:10px;background:#0b1220;border-radius:8px;overflow:hidden;margin:10px 0}.xpfill{height:100%;background:#4ade80}.mission{padding:8px 0;border-bottom:1px solid #253953}.achievement{display:inline-block;margin:4px;padding:5px 10px;border-radius:16px;background:#253d56}.deadline{border-top:1px solid #253953;margin-top:16px;padding-top:12px}.countdown{font-family:monospace;font-size:clamp(18px,5vw,25px);font-weight:700;margin:8px 0;overflow-wrap:anywhere}.cd-green{color:#4ade80}.cd-yellow{color:#facc15}.cd-red{color:#f87171}.cd-neutral,.cd-label{color:#aebed5}.cd-label,footer{font-size:12px}</style></head><body><header><small>PAINEL GERAL · CONSULTA</small><h1>Segundo Cérebro</h1><p id="updated">Carregando…</p></header><main id="app"></main><footer>Página pública. Sem valores, saldos, documentos privados ou detalhes de saúde. Dados atualizados sob comando; contagens regressivas atualizadas automaticamente.</footer><script>
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const app=document.getElementById('app'),levels=['urgente','alta','media','baixa'],labels={urgente:'Urgente',alta:'Alta',media:'Média',baixa:'Baixa'},timers=new Set();
function priority(t){if(levels.includes(t.priority))return t.priority;const s=(t.area+' '+t.text).toLowerCase();if(s.includes('tce'))return 'urgente';if(s.includes('primeira instrução')||s.includes('wellcrest'))return 'alta';if(s.includes('venda')||s.includes('rotina'))return 'baixa';return 'media'}
function section(title){app.append(el('h2',title));const n=el('div',undefined,'grid');app.append(n);return n}
function tick(){const now=Date.now();timers.forEach(t=>{if(!t.box.isConnected){timers.delete(t);return}const diff=t.target-now;if(diff<=0){t.clock.className='countdown cd-red';t.clock.textContent='Prazo atingido';return}const days=Math.floor(diff/864e5),hours=Math.floor(diff%864e5/36e5),minutes=Math.floor(diff%36e5/6e4),seconds=Math.floor(diff%6e4/1e3),pad=n=>String(n).padStart(2,'0');t.clock.textContent=days+'d '+pad(hours)+':'+pad(minutes)+':'+pad(seconds);t.clock.className='countdown '+(diff>168*36e5?'cd-green':diff>48*36e5?'cd-yellow':'cd-red')})}
function deadline(card,date,done=false){const box=el('div',undefined,'deadline');card.append(box);if(done){box.append(el('p','Concluída · sem contagem ativa','cd-label'));return}if(!date){box.append(el('p','Prazo não definido','cd-label'));return}const target=Date.parse(date);if(!Number.isFinite(target)){box.append(el('p','Prazo inválido · revisar data','cd-label'));return}const clock=el('div','Calculando…','countdown cd-neutral');box.append(el('small','Tempo restante'),clock,el('p','Prazo: '+new Date(target).toLocaleString('pt-BR',{timeZone:'America/Fortaleza'})+' · horário de São Luís','cd-label'));timers.add({box,clock,target})}
function done(item){return /^(concluíd|finalizad|pag[oa])/i.test(item.status||'')}
function linked(item,items){return item.countdownId?items.find(c=>c.id===item.countdownId):null}
function renderGamification(g){if(!g)return;const box=el('div',undefined,'gamification');box.append(el('h2','Progresso'),el('p','Nível '+g.level+' · '+g.levelName+' · '+g.xp+' / '+g.nextLevelXp+' XP · Sequência: '+g.streak+' dias'));const bar=el('div',undefined,'xpbar'),fill=el('div',undefined,'xpfill');fill.style.width=Math.max(0,Math.min(100,Math.round(g.xp/g.nextLevelXp*100)))+'%';bar.append(fill);box.append(bar,el('h3','Missões da semana'));(g.weeklyMissions||[]).forEach(m=>{const row=el('div',undefined,'mission');row.append(el('strong',m.area+' — '+m.title),el('p',(m.status||'Pendente')+' · bônus: +'+(m.xpBonus||0)+' XP'));box.append(row)});if((g.achievements||[]).length){box.append(el('h3','Conquistas'));g.achievements.forEach(a=>box.append(el('span',(a.icon||'')+' '+(a.name||a),'achievement')))}app.append(box)}
async function init(){try{const r=await fetch('data/dashboard.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json(),countdowns=d.countdowns||[],used=new Set();document.getElementById('updated').textContent='Última revisão dos dados: '+d.updated;renderGamification(d.gamification);app.append(el('p','Prioridade indica importância; status indica se a tarefa está pronta para execução ou aguardando terceiros. Prazos são exibidos apenas quando cadastrados.','notice'));const legend=el('div');levels.forEach(p=>legend.append(el('span',labels[p],'tag '+p)));app.append(legend,el('h2','Tarefas por prioridade'));const label=el('label','Filtrar prioridade: '),filter=el('select');filter.setAttribute('aria-label','Filtrar tarefas por prioridade');[['','Todas'],...levels.map(p=>[p,labels[p]])].forEach(([v,l])=>{const o=el('option',l);o.value=v;filter.append(o)});label.append(filter);app.append(label);const tasks=el('div',undefined,'grid');app.append(tasks);(d.tasks||[]).forEach(t=>{const c=linked(t,countdowns);if(c)used.add(c)});function render(){tasks.replaceChildren();(d.tasks||[]).map((t,i)=>({...t,p:priority(t),i})).filter(t=>!filter.value||t.p===filter.value).sort((a,b)=>levels.indexOf(a.p)-levels.indexOf(b.p)||a.i-b.i).forEach(t=>{const c=el('article',undefined,'card'),link=linked(t,countdowns);c.append(el('span',labels[t.p],'tag '+t.p),el('h3',t.area),el('p',t.text));if(t.status)c.append(el('p',t.status,'cd-label'));deadline(c,t.deadline||t.dueDate||(link&&link.date),done(t));tasks.append(c)});tick()}filter.onchange=render;render();const projects=section('Projetos e próximas ações');(d.projects||[]).forEach(p=>{const c=el('article',undefined,'card');c.append(el('span',p.status,'tag'),el('h3',(p.icon||'')+' '+p.name),el('p',p.next));if(p.deadline)deadline(c,p.deadline,done(p));projects.append(c)});const bills=section('Contas — sem valores');(d.bills||[]).forEach(b=>{const card=el('article',undefined,'card'),c=linked(b,countdowns)||countdowns.find(c=>c.category==='Conta'&&c.title===b.name);if(c)used.add(c);card.append(el('h3',b.name),el('p',b.status));deadline(card,b.deadline||(c&&c.date),b.paid);bills.append(card)});const rest=countdowns.filter(c=>!used.has(c));if(rest.length){const grid=section('Outros prazos e compromissos');rest.forEach(c=>{const card=el('article',undefined,'card');card.append(el('span',c.category||'Compromisso','tag'),el('h3',c.title),el('p',c.status||''));deadline(card,c.date,done(c));grid.append(card)})}const supplies=section('Contingência — estoque de 72 horas');(d.supplies||[]).forEach(s=>{const c=el('article',undefined,'card');c.append(el('span',s.status,'tag'),el('h3',s.name),el('p',s.detail));supplies.append(c)});app.append(el('p','Sem cálculo de cobertura alimentar: peso e rendimento das latas não informados. Lista de estoque ainda incompleta.','notice'));tick();setInterval(tick,1000)}catch(e){document.getElementById('updated').textContent='Não foi possível carregar o painel. Atualize a página para tentar novamente.'}}init();
</script></body></html>
