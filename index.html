<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Segundo Cérebro</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#e7eef9}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1150px;margin:auto;padding:20px}h1{font-size:32px}h2{margin-top:30px}p,small{color:#aebed5;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#152238;border:1px solid #253953;border-radius:16px;padding:18px}.tag{display:inline-block;border-radius:16px;padding:5px 10px;font-size:13px;margin:3px;background:#253d56}.urgente{background:#69272d;color:#ffe3e5}.alta{background:#653b17;color:#ffe4c5}.media{background:#554c15;color:#fff4b8}.baixa{background:#193d68;color:#d9eaff}.row{padding:12px 0;border-bottom:1px solid #253953}.notice{border-left:3px solid #70d6ef;padding-left:12px}select{padding:10px;border-radius:8px;margin-bottom:15px}.gamification{background:linear-gradient(135deg,#152238,#1b2f4d);border:1px solid #2f4d74;border-radius:16px;padding:18px;margin-bottom:18px}.xpbar{height:10px;background:#0b1220;border-radius:8px;overflow:hidden;margin:10px 0}.xpfill{height:100%;background:#4ade80}.mission{padding:8px 0;border-bottom:1px solid #253953}.achievement{display:inline-block;margin:4px 4px 0 0;padding:5px 10px;border-radius:16px;background:#253d56}.countdown{font-family:'Courier New',monospace;font-size:30px;font-weight:700;letter-spacing:2px;margin:8px 0}.cd-green{color:#4ade80}.cd-yellow{color:#facc15}.cd-red{color:#f87171}.cd-neutral{color:#aebed5}.cd-label{font-size:13px;color:#aebed5}footer{font-size:12px}</style></head><body><header><small>PAINEL GERAL · CONSULTA</small><h1>Segundo Cérebro</h1><p id="updated">Carregando…</p></header><main id="app"></main><footer>Página pública. Sem valores, saldos, documentos privados ou detalhes de saúde. Atualização sob comando, não em tempo real.</footer><script>const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};const app=document.getElementById('app');const levels=['urgente','alta','media','baixa'];const labels={urgente:'🔴 Urgente',alta:'🟠 Alta',media:'🟡 Média',baixa:'🔵 Baixa'};function priority(t){if(levels.includes(t.priority))return t.priority;const s=(t.area+' '+t.text).toLowerCase();if(s.includes('tce'))return 'urgente';if(s.includes('primeira instrução')||s.includes('wellcrest'))return 'alta';if(s.includes('venda')||s.includes('rotina'))return 'baixa';return 'media'}function section(title){app.append(el('h2',title));const n=el('div',undefined,'grid');app.append(n);return n}function renderGamification(g){if(!g)return;const box=el('div',undefined,'gamification');box.append(el('h2','🧠 Progresso'));box.append(el('p','Nível '+g.level+' · '+g.levelName+' · '+g.xp+' / '+g.nextLevelXp+' XP · 🔥 Sequência: '+g.streak+' dias'));const bar=el('div',undefined,'xpbar');const fill=el('div',undefined,'xpfill');fill.style.width=Math.max(0,Math.min(100,Math.round((g.xp/g.nextLevelXp)*100)))+'%';bar.append(fill);box.append(bar);box.append(el('h3','🎯 Missões da semana'));(g.weeklyMissions||[]).forEach(m=>{const row=el('div',undefined,'mission');row.append(el('strong',m.area+' — '+m.title),el('p',(m.status||'Pendente')+' · bônus: +'+(m.xpBonus||0)+' XP'));box.append(row)});const unlocked=(g.achievements||[]);if(unlocked.length){box.append(el('h3','🏅 Conquistas'));unlocked.forEach(a=>box.append(el('span',(a.icon||'🏅')+' '+(a.name||a),'achievement')))}app.append(box)}function renderCountdowns(items){if(!items||!items.length)return;const grid=section('⏳ Contadores regressivos');const timers=[];items.forEach(c=>{const card=el('article',undefined,'card');card.append(el('span',c.category||'Compromisso','tag'),el('h3',c.title),el('p',c.status||''));const clock=el('div',undefined,'countdown cd-neutral');const label=el('p',undefined,'cd-label');card.append(clock,label);grid.append(card);if(!c.date){clock.textContent='-- : -- : -- : --';label.textContent='Data a definir';return}const target=new Date(c.date);timers.push({target,clock,label})});function update(){const now=new Date();timers.forEach(t=>{const diff=t.target-now;if(diff<=0){t.clock.className='countdown cd-neutral';t.clock.textContent='Prazo atingido';t.label.textContent='Verificar conclusão ou nova data';return}const days=Math.floor(diff/864e5),hours=Math.floor(diff%864e5/36e5),minutes=Math.floor(diff%36e5/6e4),seconds=Math.floor(diff%6e4/1e3);const pad=n=>String(n).padStart(2,'0');t.clock.textContent=pad(days)+'d '+pad(hours)+':'+pad(minutes)+':'+pad(seconds);const hoursTotal=diff/36e5;t.clock.className='countdown '+(hoursTotal>168?'cd-green':hoursTotal>48?'cd-yellow':'cd-red');t.label.textContent='Faltam '+days+' dia(s), '+hours+' hora(s), '+minutes+' minuto(s) e '+seconds+' segundo(s)'})}update();setInterval(update,1000)}async function init(){try{const r=await fetch('data/dashboard.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();document.getElementById('updated').textContent='Última revisão dos dados: '+d.updated;renderGamification(d.gamification);renderCountdowns(d.countdowns);app.append(el('p','Prioridade indica importância; status indica se a tarefa está pronta para execução ou aguardando terceiros. Os horários registrados nos textos são planos, não confirmação de execução.','notice'));const legend=el('div');levels.forEach(p=>legend.append(el('span',labels[p],'tag '+p)));app.append(legend);app.append(el('p','Urgente: consequência imediata. Alta: prazo ou entrega importante. Média: avanço normal. Baixa: sem prazo crítico. Classificação inicial por área; um campo priority explícito prevalece.'));app.append(el('h2','Tarefas por prioridade'));const label=el('label','Filtrar prioridade: ');const filter=el('select');filter.setAttribute('aria-label','Filtrar tarefas por prioridade');[['','Todas'],...levels.map(p=>[p,labels[p]])].forEach(([v,l])=>{const o=el('option',l);o.value=v;filter.append(o)});label.append(filter);app.append(label);const tasks=el('div',undefined,'grid');app.append(tasks);function render(){tasks.replaceChildren();d.tasks.map((t,i)=>({...t,p:priority(t),i})).filter(t=>!filter.value||t.p===filter.value).sort((a,b)=>levels.indexOf(a.p)-levels.indexOf(b.p)||a.i-b.i).forEach(t=>{const c=el('article',undefined,'card');c.append(el('span',labels[t.p],'tag '+t.p),el('h3',t.area),el('p',t.text));tasks.append(c)})}filter.onchange=render;render();const projects=section('Projetos e próximas ações');d.projects.forEach(p=>{const c=el('article',undefined,'card');c.append(el('span',p.status,'tag'),el('h3',(p.icon||'')+' '+p.name),el('p',p.next));projects.append(c)});const bills=section('Contas — sem valores');const bc=el('div',undefined,'card');d.bills.forEach(b=>{const row=el('div',undefined,'row');row.append(el('strong',b.name),el('p',b.status));bc.append(row)});bills.append(bc);const supplies=section('Contingência — estoque de 72 horas');d.supplies.forEach(s=>{const c=el('article',undefined,'card');c.append(el('span',s.status,'tag'),el('h3',s.name),el('p',s.detail));supplies.append(c)});app.append(el('p','Sem cálculo de cobertura alimentar: peso e rendimento das latas não informados. Lista de estoque ainda incompleta.','notice'))}catch(e){document.getElementById('updated').textContent='Não foi possível carregar o painel. Atualize a página para tentar novamente.'}}init();</script></body></html>
