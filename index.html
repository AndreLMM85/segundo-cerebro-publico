<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Segundo Cérebro</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#e7eef9}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1150px;margin:auto;padding:20px}h1{font-size:32px}h2{margin-top:30px}p,small{color:#aebed5;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#152238;border:1px solid #253953;border-radius:16px;padding:18px}.tag{display:inline-block;border-radius:16px;padding:5px 10px;font-size:13px;margin:3px;background:#253d56}.urgente{background:#69272d;color:#ffe3e5}.alta{background:#653b17;color:#ffe4c5}.media{background:#554c15;color:#fff4b8}.baixa{background:#193d68;color:#d9eaff}.row{padding:12px 0;border-bottom:1px solid #253953}.notice{border-left:3px solid #70d6ef;padding-left:12px}select{padding:10px;border-radius:8px;margin-bottom:15px}footer{font-size:12px}</style></head><body><header><small>PAINEL GERAL · CONSULTA</small><h1>Segundo Cérebro</h1><p id="updated">Carregando…</p></header><main id="app"></main><footer>Página pública. Sem valores, saldos, documentos privados ou detalhes de saúde. Atualização sob comando, não em tempo real.</footer><script>const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};const app=document.getElementById('app');const levels=['urgente','alta','media','baixa'];const labels={urgente:'🔴 Urgente',alta:'🟠 Alta',media:'🟡 Média',baixa:'🔵 Baixa'};function priority(t){if(levels.includes(t.priority))return t.priority;const s=(t.area+' '+t.text).toLowerCase();if(s.includes('tce'))return 'urgente';if(s.includes('primeira instrução')||s.includes('wellcrest'))return 'alta';if(s.includes('venda')||s.includes('rotina'))return 'baixa';return 'media'}function section(title){app.append(el('h2',title));const n=el('div',undefined,'grid');app.append(n);return n}async function init(){try{const r=await fetch('data/dashboard.json',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();document.getElementById('updated').textContent='Última revisão dos dados: '+d.updated;app.append(el('p','Prioridade indica importância; status indica se a tarefa está pronta para execução ou aguardando terceiros. Os horários registrados nos textos são planos, não confirmação de execução.','notice'));const legend=el('div');levels.forEach(p=>legend.append(el('span',labels[p],'tag '+p)));app.append(legend);app.append(el('p','Urgente: consequência imediata. Alta: prazo ou entrega importante. Média: avanço normal. Baixa: sem prazo crítico. Classificação inicial por área; um campo priority explícito prevalece.'));app.append(el('h2','Tarefas por prioridade'));const label=el('label','Filtrar prioridade: ');const filter=el('select');filter.setAttribute('aria-label','Filtrar tarefas por prioridade');[['','Todas'],...levels.map(p=>[p,labels[p]])].forEach(([v,l])=>{const o=el('option',l);o.value=v;filter.append(o)});label.append(filter);app.append(label);const tasks=el('div',undefined,'grid');app.append(tasks);function render(){tasks.replaceChildren();d.tasks.map((t,i)=>({...t,p:priority(t),i})).filter(t=>!filter.value||t.p===filter.value).sort((a,b)=>levels.indexOf(a.p)-levels.indexOf(b.p)||a.i-b.i).forEach(t=>{const c=el('article',undefined,'card');c.append(el('span',labels[t.p],'tag '+t.p),el('h3',t.area),el('p',t.text));tasks.append(c)})}filter.onchange=render;render();const projects=section('Projetos e próximas ações');d.projects.forEach(p=>{const c=el('article',undefined,'card');c.append(el('span',p.status,'tag'),el('h3',(p.icon||'')+' '+p.name),el('p',p.next));projects.append(c)});const bills=section('Contas — sem valores');const bc=el('div',undefined,'card');d.bills.forEach(b=>{const row=el('div',undefined,'row');row.append(el('strong',b.name),el('p',b.status));bc.append(row)});bills.append(bc);const supplies=section('Contingência — estoque de 72 horas');d.supplies.forEach(s=>{const c=el('article',undefined,'card');c.append(el('span',s.status,'tag'),el('h3',s.name),el('p',s.detail));supplies.append(c)});app.append(el('p','Sem cálculo de cobertura alimentar: peso e rendimento das latas não informados. Lista de estoque ainda incompleta.','notice'))}catch(e){document.getElementById('updated').textContent='Não foi possível carregar o painel. Atualize a página para tentar novamente.'}}init();</script></body></html>
