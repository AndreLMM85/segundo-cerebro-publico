<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Segundo Cérebro</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1220;color:#e7eef9}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1150px;margin:auto;padding:24px}header{padding-bottom:8px}h1{margin:6px 0;font-size:clamp(26px,5vw,40px)}h2{margin-top:30px;font-size:20px}p,small{color:#aebed5;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#152238;border:1px solid #253953;border-radius:18px;padding:20px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#152238;padding:16px;border-radius:14px}.metric strong{display:block;color:#70d6ef;font-size:30px}.tag{display:inline-block;background:#253d56;color:#b9ebfa;border-radius:20px;padding:4px 10px;font-size:12px}.icon{display:block;font-size:28px;color:#70d6ef}.card h3{margin:12px 0 8px}ul{padding-left:20px}li{margin:10px 0;line-height:1.5}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #253953}.row:last-child{border:0}.notice{border-left:3px solid #70d6ef;padding-left:12px}footer{font-size:12px;color:#aebed5}@media(max-width:480px){header,main,footer{padding:16px}.metric{padding:12px}.metric span{font-size:12px}}</style></head><body><header><small>PAINEL GERAL · CONSULTA</small><h1>Segundo Cérebro</h1><p id="updated">Carregando informações…</p></header><main id="app"></main><footer>Página pública. Sem valores, saldos, documentos privados ou detalhes de saúde. Dados atualizados sob comando, não em tempo real.</footer><script>const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};const app=document.getElementById('app');function section(title){app.append(el('h2',title));const n=el('div',undefined,'grid');app.append(n);return n}async function init(){try{const r=await fetch('data/dashboard.json',{cache:'no-store'});if(!r.ok)throw Error('Falha no carregamento');const d=await r.json();document.getElementById('updated').textContent='Última revisão: '+d.updated;const m=el('div',undefined,'metrics');[[d.projects.length,'Projetos'],[d.tasks.length,'Pendências'],[d.bills.filter(b=>b.paid).length,'Contas pagas registradas']].forEach(([v,label])=>{const c=el('div',undefined,'metric');c.append(el('strong',String(v)),el('span',label));m.append(c)});app.append(m,el('p','Prioridades do dia ainda não definidas. Prazos e pagamentos não confirmados não são tratados como atrasados.','notice'));const projects=section('Projetos e próximas ações');d.projects.forEach(p=>{const c=el('article',undefined,'card');c.append(el('span',p.icon,'icon'),el('span',p.status,'tag'),el('h3',p.name),el('p',p.next));projects.append(c)});const tasks=section('O que precisa ser feito');const groups={};d.tasks.forEach(t=>(groups[t.area]??=[]).push(t.text));Object.entries(groups).forEach(([area,items])=>{const c=el('article',undefined,'card');c.append(el('h3',area));const ul=el('ul');items.forEach(t=>ul.append(el('li',t)));c.append(ul);tasks.append(c)});const bills=section('Contas — sem valores');const bc=el('div',undefined,'card');d.bills.forEach(b=>{const row=el('div',undefined,'row');row.append(el('span',b.name),el('small',b.status));bc.append(row)});bills.append(bc);const supplies=section('Contingência — estoque de 72 horas');d.supplies.forEach(s=>{const c=el('article',undefined,'card');c.append(el('span',s.status,'tag'),el('h3',s.name),el('p',s.detail));supplies.append(c)});app.append(el('p','Sem cálculo de cobertura alimentar: peso e rendimento das latas não informados. Lista de estoque ainda incompleta.','notice'))}catch(e){document.getElementById('updated').textContent='Não foi possível carregar o painel. Atualize a página para tentar novamente.'}}init();</script></body></html>
